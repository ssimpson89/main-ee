---
version: 3

# Default execution environment: ansible-core 2.20 on Rocky Linux 10.
#
# Collections, python packages and system packages live in the shared
# requirements.yml / requirements.txt / bindep.txt so that this file and
# execution-environment-2.16.yml cannot drift apart. Only the interpreter,
# the ansible-core pin and the genuinely version-specific build steps differ.
#
# To manage EL8 or older targets, use execution-environment-2.16.yml.

images:
  base_image:
    name: rockylinux/rockylinux:10

dependencies:
  # Declared explicitly even though it matches the Rocky 10 default: without
  # it ansible-builder omits the PYPKG build arg entirely, and the
  # $PYPKG-devel / $PYPKG-rpm steps below would expand to "-devel" / "-rpm".
  python_interpreter:
    package_system: python3
    python_path: /usr/bin/python3
  ansible_core:
    package_pip: ansible-core>=2.20.0,<2.21
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_files:
  - src: includes/ascender.sudoers
    dest: configs
  - src: includes/google-cloud-cli.repo
    dest: configs
  - src: includes/update-ca-trust
    dest: files

additional_build_steps:
  # Everything here lands in the `base` stage, which galaxy, builder and
  # final all inherit, so it is built and cached exactly once.
  prepend_base:
    - RUN $PKGMGR update -y && $PKGMGR clean all
  append_base:
    - RUN $PYCMD -m pip install -U pip
    # ovirt-engine-sdk-python and a few others still emit
    # incompatible-pointer-types, which is an error as of gcc 14.
    - ENV CFLAGS="-Wno-error=incompatible-pointer-types"
    - COPY --chmod=644 _build/configs/google-cloud-cli.repo /etc/yum.repos.d/google-cloud-cli.repo
    - >-
      RUN curl -fsSL https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo
      -o /etc/yum.repos.d/hashicorp.repo
      && $PKGMGR install -y terraform
      && $PKGMGR clean all

  # bindep cannot template the interpreter name, so the python-versioned
  # devel package is installed here instead. Builder stage only, so it stays
  # out of the final image.
  prepend_builder:
    - RUN $PKGMGR install -y $PYPKG-devel

  append_final:
    - COPY --from=quay.io/ansible/receptor:devel /usr/bin/receptor /usr/bin/receptor
    - COPY --chmod=440 _build/configs/ascender.sudoers /etc/sudoers.d/ascender
    - COPY --chmod=755 _build/files/update-ca-trust /usr/bin/update-ca-trust
    # rpm bindings for the interpreter in use, so the dnf/yum modules work
    # against localhost inside the EE.
    - RUN $PKGMGR install -y --enablerepo epel $PYPKG-rpm && $PKGMGR clean all
    - >-
      RUN mkdir -p /var/run/receptor
      && useradd -G wheel -M -u 1000 -d /runner ascender
      && chown -R ascender:wheel /runner
      && git lfs install --system
      && ln -s /usr/bin/podman-remote /usr/bin/podman
    # User site-packages, so lookup plugins can import pip-installed modules.
    - RUN mkdir -p $($PYCMD -m site --user-site | sed "s|$HOME|$(pwd)|")
    - RUN chmod -R ug+rwx $($PYCMD -m site --user-site | sed "s|$HOME|$(pwd)|" | cut -d '/' -f1,2,3)
