---
# Galaxy collections, shared by every execution-environment variant.
#
# Pinned versions are deliberate: unpinned ranges make the galaxy resolve
# slower, make builds unreproducible, and defeat layer caching in CI, since
# a new upstream release silently changes the image.
collections:
  - name: amazon.aws
    version: "9.5.0"
  - name: ansible.posix
    version: ">=2.0.0"
  - name: ansible.utils
    version: ">=6.0.0"
  - name: ansible.windows
    version: ">=3.1.0"
  - name: ansibleguy.opnsense
    version: ">=1.2.12"
  - name: awx.awx
    version: "24.6.1"
  - name: azure.azcollection
    version: ">=3.6.0"
  - name: community.aws
    version: "9.3.0"
  - name: community.general
    version: ">=11.0.0"
  - name: community.libvirt
    version: ">=1.3.1"
  - name: community.proxmox
    version: ">=1.0.1"
  - name: community.vmware
    version: "4.8.6"
  - name: community.windows
    version: ">=3.0.0"
  - name: google.cloud
    version: ">=1.6.0"
  - name: kubernetes.core
    version: ">=6.0.0"
  - name: microsoft.ad
    version: ">=1.9.1"
  - name: openstack.cloud
    version: ">=2.4.1"
  - name: ovirt.ovirt
    version: ">=3.2.1"
  - name: theforeman.foreman
    version: ">=5.4.0"
  - name: vultr.cloud
    version: ">=1.13.0"
