---
# Galaxy collections for the LEGACY variant (ansible-core 2.16).
#
# This list is FROZEN and deliberately does not track requirements.yml. It
# holds the newest release of each collection that still declares
# requires_ansible compatible with core 2.16. Adding a collection to the
# default variant does not add it here, and that is correct: this image exists
# only to keep managing EL8 targets, not to gain new capability.
#
# Two entries differ from the default list, both forced by upstream:
#
#   community.general  11.4.9, not 13.4.0. 12.x requires core >=2.17 and
#                      13.x requires >=2.18.
#   community.proxmox  absent. Every version ever published, 0.1.0 through
#                      2.0.0, requires core >=2.17. There is no release that
#                      can load on this image.
#
# Before bumping anything here, check requires_ansible actually admits 2.16.
collections:
  - name: amazon.aws
    version: "9.5.0"
  - name: ansible.posix
    version: "2.2.2"
  - name: ansible.utils
    version: "6.1.0"
  - name: ansible.windows
    version: "3.8.0"
  - name: ansibleguy.opnsense
    version: "1.2.16"
  - name: awx.awx
    version: "24.6.1"
  - name: azure.azcollection
    version: "4.0.0"
  - name: community.aws
    version: "9.3.0"
  - name: community.general
    version: "11.4.9"
  - name: community.libvirt
    version: "2.3.0"
  - name: community.vmware
    version: "4.8.6"
  - name: community.windows
    version: "3.3.0"
  - name: google.cloud
    version: "1.14.0"
  - name: kubernetes.core
    version: "6.5.0"
  - name: microsoft.ad
    version: "1.12.1"
  - name: openstack.cloud
    version: "2.6.0"
  - name: ovirt.ovirt
    version: "3.2.2"
  - name: theforeman.foreman
    version: "5.12.0"
  - name: vultr.cloud
    version: "1.14.1"
