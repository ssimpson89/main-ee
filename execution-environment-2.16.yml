---
version: 3

images:
  base_image:
    name: rockylinux/rockylinux:9

dependencies:
  ansible_core:
    package_pip: ansible-core>=2.16.14,<2.17
  ansible_runner:
    package_pip: ansible-runner
  galaxy: |
    ---
    collections:
      - name: amazon.aws
      - name: ansible.posix
      - name: ansible.windows
      - name: awx.awx
      - name: azure.azcollection
      - name: community.windows
      - name: community.vmware
      - name: kubernetes.core
      - name: google.cloud
      - name: openstack.cloud
      - name: ovirt.ovirt
      - name: theforeman.foreman
      - name: vultr.cloud
      - name: community.libvirt
      - name: community.proxmox
  python: |
    git+https://github.com/ansible/ansible-sign
    ncclient
    paramiko
    pexpect
    pywinrm
    boto3
    proxmoxer
    google-auth
  system: |
    epel-release [platform:rpm]
    gcc [platform:rpm]
    gcc-c++ [platform:rpm]
    git-core [platform:rpm]
    git-lfs [platform:rpm]
    krb5-devel [platform:rpm compile]
    krb5-workstation [platform:rpm]
    libcurl-devel [platform:rpm compile]
    podman-remote [platform:rpm]
    python3.11 [platform:rpm]
    python3.11-pip [platform:rpm]
    python3.11-devel [platform:rpm compile]
    python-unversioned-command [platform:rpm]
    rsync [platform:rpm]
    sshpass [platform:rpm]
    subversion [platform:dpkg]
    subversion [platform:rpm]
    unzip [platform:rpm]
    sudo [platform:rpm]
    libxcrypt-compat.x86_64 [platform:rpm]
    google-cloud-cli [platform:rpm]

options:
  container_init:
    package_pip: pip>=21.1
    package_manager_path: /usr/bin/dnf

additional_build_files:
  - src: includes/sudoers
    dest: configs
  - src: includes/google-cloud-cli.repo
    dest: configs

additional_build_steps:
  prepend_base:
    - RUN alternatives --set python3 /usr/bin/python3.11
  append_base:
    - RUN $PYCMD -m pip install -U pip
    - ADD _build/configs/google-cloud-cli.repo /etc/yum.repos.d/google-cloud-cli.repo
    - RUN dnf -y install google-cloud-cli
  prepend_final:
    - COPY --from=quay.io/ansible/receptor:devel /usr/bin/receptor /usr/bin/receptor
    - RUN mkdir -p /etc/receptor
  append_final:
    - COPY _build/configs/sudoers /etc/sudoers.d/ascender
    - RUN chmod 0440 /etc/sudoers.d/ascender
    - RUN mkdir -p /runner && chown 1000:1000 /runner && chmod 0750 /runner
    - RUN useradd -u 1000 -m -s /bin/bash ascender
    - RUN echo "ascender ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
