---
name: PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

# A PR supersedes its own earlier runs.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      push: false
