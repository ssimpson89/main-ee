---
name: Build

# Reusable: builds every variant for every arch, then assembles one
# multi-arch manifest per variant.
#
# 2 ansible variants x 2 arches = 4 build jobs in parallel, each on a runner
# native to its arch. Do not swap this for QEMU: pykerberos, requests-credssp
# and ovirt-engine-sdk-python have no prebuilt aarch64 wheels and compile from
# source, which is unusably slow under emulation.
on:
  workflow_call:
    inputs:
      version_tag:
        description: Primary tag, e.g. 2026.02.1 or dev.
        required: true
        type: string
      moving_tag:
        description: Extra moving tag, e.g. latest. Empty to skip.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/main-ee
  ANSIBLE_BUILDER_VERSION: 3.1.1

jobs:
  build:
    name: ansible ${{ matrix.ansible }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        ansible: ["2.20", "2.16"]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-builder
        run: pip install "ansible-builder==${ANSIBLE_BUILDER_VERSION}"

      # 2.20 is the default variant and lives in the unsuffixed file.
      - name: Resolve variant
        id: variant
        run: |
          if [ "${{ matrix.ansible }}" = "2.20" ]; then
            echo "ee_file=execution-environment.yml" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "ee_file=execution-environment-${{ matrix.ansible }}.yml" >> "$GITHUB_OUTPUT"
            echo "suffix=-${{ matrix.ansible }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate build context
        run: ansible-builder create -v3 -f "${{ steps.variant.outputs.ee_file }}" -c context

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only. The merge job below turns the per-arch digests
      # into the tags people actually pull.
      #
      # provenance is off because the attestation manifest it adds makes the
      # pushed reference an index, which `buildx imagetools create` cannot
      # then nest into the final manifest list. Revisit if attestations are
      # wanted; it needs a different merge step.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./context
          file: ./context/Containerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.ansible }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.ansible }}-${{ matrix.arch }},mode=max
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${{ matrix.arch }}@${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.ansible }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest for ansible ${{ matrix.ansible }}
    runs-on: ubuntu-24.04
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        ansible: ["2.20", "2.16"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-${{ matrix.ansible }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        run: |
          set -euo pipefail
          if [ "${{ matrix.ansible }}" = "2.20" ]; then SUFFIX=""; else SUFFIX="-${{ matrix.ansible }}"; fi

          TAGS="--tag ${IMAGE}:${{ inputs.version_tag }}${SUFFIX}"
          if [ -n "${{ inputs.moving_tag }}" ]; then
            TAGS="${TAGS} --tag ${IMAGE}:${{ inputs.moving_tag }}${SUFFIX}"
          fi

          SOURCES=""
          for f in /tmp/digests/*; do
            SOURCES="${SOURCES} ${IMAGE}@sha256:${f##*@}"
          done
          echo "Assembling${TAGS} from${SOURCES}"

          # shellcheck disable=SC2086
          docker buildx imagetools create ${TAGS} ${SOURCES}

      - name: Inspect result
        run: |
          if [ "${{ matrix.ansible }}" = "2.20" ]; then SUFFIX=""; else SUFFIX="-${{ matrix.ansible }}"; fi
          docker buildx imagetools inspect "${IMAGE}:${{ inputs.version_tag }}${SUFFIX}"
