---
name: Build dev images

on:
  workflow_dispatch:
  schedule:
    # Rebuild nightly so the dev tag picks up base-image errata.
    - cron: "0 4 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version_tag: dev
